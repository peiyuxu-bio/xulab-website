<main id="main"><div class="research-stage">
    <div class="page-heading is-label"><h1>研究方向<span>.</span></h1><p>实验与 AI 并重，<br>发掘、解码、重塑分子机器</p></div>
    <div class="pillars" role="tablist" aria-label="研究主题" aria-orientation="vertical">
      <button class="pillar" role="tab" id="tab-discover" aria-controls="panel-discover" aria-selected="true" data-panel="discover" aria-labelledby="name-discover" aria-describedby="more-discover"><span class="pillar-num">01</span><span class="pillar-name" id="name-discover">发现<span>.</span></span><span class="pillar-more" id="more-discover"><span><span class="pillar-q">自然界里还藏着什么？</span><span class="pillar-lead">自然界的分子宝库，绝大部分尚待探索。我们在细菌、古菌、病毒和真核生物的基因组与宏基因组中，寻找尚未被表征的分子系统。借由这一探索，真核生物基因组编码的 Fanzor 蛋白被证实是 RNA 引导的核酸内切酶，原核生物及其病毒中模块化的 RNA 引导 DNA 靶向系统 TIGR-Tas 也随之揭示。</span></span></span></button>
      <button class="pillar" role="tab" id="tab-decode" aria-controls="panel-decode" aria-selected="false" tabindex="-1" data-panel="decode" aria-labelledby="name-decode" aria-describedby="more-decode"><span class="pillar-num">02</span><span class="pillar-name" id="name-decode">解析<span>.</span></span><span class="pillar-more" id="more-decode"><span><span class="pillar-q">它如何运作？又如何演化而来？</span><span class="pillar-lead">每发现一个新系统，我们都会追问：它有什么作用？如何识别靶标？从何而来？我们综合运用生物化学、细胞实验、结构生物学和演化分析来回答这些问题，从分子机制一直深入到生物学功能。</span></span></span></button>
      <button class="pillar" role="tab" id="tab-redesign" aria-controls="panel-redesign" aria-selected="false" tabindex="-1" data-panel="redesign" aria-labelledby="name-redesign" aria-describedby="more-redesign"><span class="pillar-num">03</span><span class="pillar-name" id="name-redesign">重塑<span>.</span></span><span class="pillar-more" id="more-redesign"><span><span class="pillar-q">我们能用它造出什么？</span><span class="pillar-lead">理解机制，才能重建机器。我们把 AI 视为科研合作者：读懂蛋白质与 RNA「语言」的模型，帮助我们设计新的分子机器，预测它们在细胞中如何工作，并挑选最有价值的实验；实验则让模型始终脚踏实地。二者结合，缩短从自然发现到下一代疗法的距离。</span></span></span></button>
    </div>
  <div class="research-visual">
    <section class="panel is-active" id="panel-discover" role="tabpanel" aria-labelledby="tab-discover">
      <div class="panel-art"><svg id="tree" class="tree" viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="示意性生命之树的一部分，分支末端是生物的线描图。"></svg></div>
    </section>
    <section class="panel" id="panel-decode" role="tabpanel" aria-labelledby="tab-decode" hidden>
      <div class="panel-art decode-art">
        <div id="viewport" class="molecular-viewport">
          <canvas aria-label="放大的 SpuFz1 蛋白表面（半透明白色）、ωRNA（浅蓝色）与 DNA（珊瑚色与杏色），来自 PDB 8GKH，DNA 延伸段为建模所得。拖动可旋转。" role="img"></canvas>
        </div>
        <p id="status" class="molecular-status" role="status">正在加载结构…</p>
      </div>
      <p class="panel-caption" hidden><button id="motion" aria-pressed="false" disabled>暂停旋转</button></p>
    </section>
    <section class="panel" id="panel-redesign" role="tabpanel" aria-labelledby="tab-redesign" hidden>
      <div class="panel-art"><div id="genome" class="genome" role="img" aria-label="科学家与 AI 在同一张手绘草图上反复推敲一个分子，依次是 DNA 双链、向导 RNA 和蛋白质。每轮定稿后，改动写入下方 DNA 序列中编码它的位置：一个碱基对对应一个字母，一个核苷酸对应一个字母，一个氨基酸对应三个字母（密码子）。RNA 碱基对的两个碱基总是同时改变，茎区始终保持配对。"></div></div>
    </section>
