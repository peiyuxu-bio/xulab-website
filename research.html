<main id="main"><div class="research-stage">
    <div class="page-heading is-label"><h1>Research<span>.</span></h1><p>Reading, understanding and rewriting molecular machines, at the bench and with AI.</p></div>
    <div class="pillars" role="tablist" aria-label="Research themes" aria-orientation="vertical">
      <button class="pillar" role="tab" id="tab-discover" aria-controls="panel-discover" aria-selected="true" data-panel="discover" aria-labelledby="name-discover" aria-describedby="more-discover"><span class="pillar-num">01</span><span class="pillar-name" id="name-discover">Discover<span>.</span></span><span class="pillar-more" id="more-discover"><span><span class="pillar-q">What else is out there?</span><span class="pillar-lead">Most of nature’s molecular toolkit is still unexplored. We search genomes and metagenomes across bacteria, archaea, viruses and eukaryotes for systems that no one has characterized. This search showed that Fanzor proteins, encoded in eukaryotic genomes, are RNA-guided endonucleases, and revealed TIGR-Tas, a family of modular RNA-guided DNA-targeting systems in prokaryotes and their viruses.</span></span></span></button>
      <button class="pillar" role="tab" id="tab-decode" aria-controls="panel-decode" aria-selected="false" tabindex="-1" data-panel="decode" aria-labelledby="name-decode" aria-describedby="more-decode"><span class="pillar-num">02</span><span class="pillar-name" id="name-decode">Decode<span>.</span></span><span class="pillar-more" id="more-decode"><span><span class="pillar-q">How does it work, and how did it evolve?</span><span class="pillar-lead">Every new system raises the same questions: what does it do, how does it choose its targets, and where did it come from? We answer them with biochemistry, cell-based experiments, structural biology and evolutionary analysis, following each system from molecular mechanism to biological function.</span></span></span></button>
      <button class="pillar" role="tab" id="tab-redesign" aria-controls="panel-redesign" aria-selected="false" tabindex="-1" data-panel="redesign" aria-labelledby="name-redesign" aria-describedby="more-redesign"><span class="pillar-num">03</span><span class="pillar-name" id="name-redesign">Redesign<span>.</span></span><span class="pillar-more" id="more-redesign"><span><span class="pillar-q">What can we build with it?</span><span class="pillar-lead">Understanding a mechanism lets us rebuild it. We see AI as a scientific collaborator: models that learn the language of proteins and RNA let us design new molecular machines, predict how they act in cells, and choose the most informative experiments, while the bench keeps them honest. Together they shorten the path from a discovery in nature to the next generation of therapies.</span></span></span></button>
    </div>
